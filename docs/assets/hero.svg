<rect x="66" y="474" width="517" height="68" rx="13" fill="#203340" stroke="#415560"/><circle cx="100" cy="508" r="19" fill="#97e4c2"/><text x="93" y="515" font-size="20" font-weight="bold" fill="#162434">A</text><text x="136" y="516" font-size="23" fill="#f3f7f3">Current chat → speak → send</text>
