<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">ChatGPT Gamepad</title><desc id="desc">Talk. Send. Scroll. One tiny controller. B starts a new chat; A continues the current one.</desc>
