<rect width="1200" height="620" rx="24" fill="url(#bg)"/>
<g fill="none" stroke="#ffffff" opacity=".045"><path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M150 0V620M300 0V620M450 0V620M600 0V620M750 0V620M900 0V620M1050 0V620"/></g>
<rect x="62" y="52" width="214" height="34" rx="17" fill="#243f40"/><text x="80" y="75" fill="#99efc8" font-family="Arial,sans-serif" font-size="14" font-weight="bold" letter-spacing="2">CHATGPT GAMEPAD</text>
<g font-family="Arial,sans-serif" fill="#f5f7f3" font-weight="bold" font-size="70"><text x="60" y="180">Talk. Send.</text><text x="60" y="258">Scroll.</text></g>
<text x="64" y="311" fill="#b6c9c7" font-family="Arial,sans-serif" font-size="26">One tiny controller.</text>
